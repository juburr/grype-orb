description: >
  Installs the grype binary for the machine's architecture (Linux amd64 or arm64).
  This command should be invoked prior to calling any other commands.
parameters:
  caching:
    type: boolean
    default: true
  install_path:
    type: string
    default: "/home/circleci/bin"
    description: Path to a binary directory not requiring root access (no trailing slash).
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 checksum verification of the downloaded Grype executable.
      "strict" (the default) fails before downloading when this orb has no
      checksum for the requested version. "known_versions" verifies listed
      versions but installs unlisted versions unverified, with a warning.
      "false" disables verification and is not recommended.
  version:
    type: string
    default: "0.119.0"
    description: Specify the semver of the Grype version to install.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        - restore_cache:
            key: grype-cache-v2-{{ arch }}-<< parameters.version >>
  - run:
      name: Install Grype
      environment:
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: grype-cache-v2-{{ arch }}-<< parameters.version >>
            paths:
              - grype.tar.gz
  - run:
      name: Cleanup Grype Install
      command: rm grype.tar.gz
