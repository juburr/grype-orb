description: Scans a container image, SBOM, directory, or other Grype source.
parameters:
  fail_on:
    type: enum
    enum: ["", "negligible", "low", "medium", "high", "critical"]
    default: ""
    description: >
      Exits with error code 2 if a vulnerability is found at or above the
      supplied severity level. Grype 0.91.0 and earlier exit with error code 1.
  image:
    type: string
    default: ""
    description: >
      Backward-compatible container image input. Mutually exclusive with
      source; prefer source for new configurations.
  source:
    type: string
    default: ""
    description: >
      Grype source to scan, including image references and explicit schemes
      such as sbom:, dir:, registry:, docker:, oci-dir:, cpes:, or zarf:.
  config:
    type: string
    default: ""
    description: Optional Grype configuration file passed with --config.
  only_fixed:
    type: boolean
    default: false
    description: When true, report only vulnerabilities that have a fix.
  output_format:
    type: enum
    enum: ["", "json", "table", "cyclonedx", "cyclonedx-json", "sarif", "template"]
    default: ""
    description: >
      Format of a single output report. Defaults to sarif when output_formats
      is not set. Cannot be combined with output_formats.
  output_file:
    type: string
    default: ""
    description: >
      File to write a single output report to. Defaults to
      grype-scan-results.sarif when output_formats is not set. Cannot be
      combined with output_formats.
  output_formats:
    type: string
    default: ""
    description: >
      Comma-separated format=path pairs, such as
      "json=scan.json,table=scan.txt", all rendered from a single scan (one
      cataloging pass and one vulnerability database snapshot). Each pair is
      passed to Grype as its own -o format=path flag. Cannot be combined with
      output_format or output_file.
steps:
  - run:
      name: Scan Image
      environment:
        PARAM_FAIL_ON: << parameters.fail_on >>
        PARAM_CONFIG: << parameters.config >>
        PARAM_IMAGE: << parameters.image >>
        PARAM_ONLY_FIXED: << parameters.only_fixed >>
        PARAM_OUTPUT_FILE: << parameters.output_file >>
        PARAM_OUTPUT_FORMAT: << parameters.output_format >>
        PARAM_OUTPUT_FORMATS: << parameters.output_formats >>
        PARAM_SOURCE: << parameters.source >>
      command: << include(scripts/scan_image.sh) >>
