description: >
  Updates the Grype vulnerability database in database_dir, and points the
  job's later steps (such as scan) at that directory.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the vulnerability database between jobs. Each job restores the
      newest database built today, or else on one of the two days before,
      saved for its home directory, database_dir, Grype schema and database
      feed, and skips the download when that database is still current. A
      job that downloads a newer database saves it under a key naming that
      database. Recommended, because Anchore's database host can be slow or
      fail at peak hours.
  database_dir:
    type: string
    default: "~/.cache/grype/db"
    description: >
      Directory where Grype stores the vulnerability database. A leading ~ is
      expanded to $HOME, a relative path is resolved against the working
      directory, and environment variables are expanded. The result is set
      as GRYPE_DB_CACHE_DIR for the update and exported through $BASH_ENV,
      so later steps of the job, such as scan, use the same database. With
      caching, this directory is restored and saved as given; the cache
      steps expand ~ but not environment variables.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # A saved cache is never replaced, so the database is saved under a
        # key naming the database and its build date, and the newest database
        # built today, then on the two days before, then any is restored (see
        # scripts/database_cache_key.sh). v1 used one fixed key, which froze
        # the cache at the first database saved.
        - run:
            name: Prepare vulnerability database cache location
            environment:
              PARAM_DATABASE_DIR: << parameters.database_dir >>
              ORB_DB_CACHE_KEY_PART: location
              ORB_DB_CACHE_KEY_PREFIX: /tmp/grype-orb-db-cache
            command: << include(scripts/database_cache_key.sh) >>
        - restore_cache:
            keys:
              - grype-vuln-db-v2-{{ checksum "/tmp/grype-orb-db-cache-location" }}-{{ checksum "/tmp/grype-orb-db-cache-day0" }}-
              - grype-vuln-db-v2-{{ checksum "/tmp/grype-orb-db-cache-location" }}-{{ checksum "/tmp/grype-orb-db-cache-day1" }}-
              - grype-vuln-db-v2-{{ checksum "/tmp/grype-orb-db-cache-location" }}-{{ checksum "/tmp/grype-orb-db-cache-day2" }}-
              - grype-vuln-db-v2-{{ checksum "/tmp/grype-orb-db-cache-location" }}-
  - run:
      name: Update Vulnerability Database
      environment:
        PARAM_DATABASE_DIR: << parameters.database_dir >>
      command: << include(scripts/update_database.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - run:
            name: Prepare vulnerability database cache key
            environment:
              ORB_DB_CACHE_KEY_PART: database
              ORB_DB_CACHE_KEY_PREFIX: /tmp/grype-orb-db-cache
            command: << include(scripts/database_cache_key.sh) >>
        - save_cache:
            key: grype-vuln-db-v2-{{ checksum "/tmp/grype-orb-db-cache-location" }}-{{ checksum "/tmp/grype-orb-db-cache-built" }}-{{ checksum "/tmp/grype-orb-db-cache-database" }}
            paths:
              - << parameters.database_dir >>
  - run:
      name: Log Vulnerability Databases
      command: grype db list
