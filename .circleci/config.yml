version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4
  bats: circleci/bats@1.1

filters: &filters
  tags:
    only: /.*/

jobs:
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash tests/install_test.sh
  test-shell-conventions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Check the shell conventions of src/scripts
          command: bash tests/shell_conventions_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-shell-conventions:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: grype
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Offline unit tests for the orb's scripts (tests/*.bats).
      - bats/run:
          path: ./tests
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: grype-orb
          requires: [test-install, test-shell-conventions, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check, bats/run]
          filters: *filters
