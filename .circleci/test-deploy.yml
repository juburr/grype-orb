version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  grype-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      # Run your orb's commands to validate them.
      - grype-orb/install
      - run:
          name: Verify Install
          command: |
            command -v grype
            grype version
            grype version | grep -E '^Platform:[[:space:]]+linux/amd64$'
      - grype-orb/log_version
      - grype-orb/update_database
      - grype-orb/scan_image:
          image: gcr.io/distroless/base:latest
          output_file: distroless.base.scan.json
          output_format: json
      - run:
          name: Log Scan Results
          command: cat distroless.base.scan.json
      - run:
          name: Create a minimal Grype policy file
          command: printf '{}\n' > /tmp/grype-orb-test.yaml
      - grype-orb/scan_image:
          source: dir:.
          config: /tmp/grype-orb-test.yaml
          only_fixed: true
          output_file: repository.scan.json
          output_format: json
      - run:
          name: Verify source/config/only-fixed scan
          command: test -s repository.scan.json
      # VEX: the fixture SBOM holds zlib 1.2.11-r3 from Alpine 3.15, an end-of-life
      # release whose security data no longer changes. Its explicit placeholder CPE
      # keeps NVD's CPE data (which does change) out of the matches, leaving two
      # CVEs. The OpenVEX fixture marks only the Critical one (CVE-2022-37434)
      # not_affected.
      - grype-orb/scan_image:
          source: sbom:tests/fixtures/vex/zlib.cdx.json
          output_file: vex-baseline.scan.json
          output_format: json
      - run:
          name: Verify VEX Fixture Baseline
          command: |
            # Without VEX, CVE-2022-37434 must be the fixture's only Critical, so
            # the fail_on: critical scans below test exactly that one match.
            jq -e '[.matches[] | select(.vulnerability.severity == "Critical") | .vulnerability.id] == ["CVE-2022-37434"]' vex-baseline.scan.json
      - grype-orb/scan_image:
          source: sbom:tests/fixtures/vex/zlib.cdx.json
          vex: tests/fixtures/vex/zlib.openvex.json
          fail_on: critical
          output_file: vex-parameter.scan.json
          output_format: json
      - grype-orb/scan_image:
          source: sbom:tests/fixtures/vex/zlib.cdx.json
          config: tests/fixtures/vex/grype.yaml
          fail_on: critical
          output_file: vex-config.scan.json
          output_format: json
      - run:
          name: Verify VEX Filtering
          command: |
            for report in vex-parameter.scan.json vex-config.scan.json; do
              echo "Checking ${report}"
              # The VEX'd CVE moved to ignoredMatches...
              jq -e 'all(.matches[]; .vulnerability.id != "CVE-2022-37434")' "${report}"
              jq -e 'any(.ignoredMatches[]; .vulnerability.id == "CVE-2022-37434")' "${report}"
              # ...while the High CVE the statement does not cover is still reported.
              jq -e 'any(.matches[]; .vulnerability.id == "CVE-2018-25032")' "${report}"
            done

  # Runs the orb natively on an Arm machine executor, with default parameters.
  command-test-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      - grype-orb/install
      - run:
          name: Verify Native arm64 Install
          command: |
            echo "PATH=${PATH}"
            command -v grype
            grype version
            grype version | grep -E '^Platform:[[:space:]]+linux/arm64$'
      - grype-orb/log_version
      - grype-orb/update_database
      - grype-orb/scan_image:
          source: dir:.
          output_file: repository.arm64.scan.json
          output_format: json
      - run:
          name: Verify arm64 Scan
          command: test -s repository.arm64.scan.json

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - command-test-arm64:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/grype-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - command-test-arm64
          context: orb-publishing
          filters: *release-filters
